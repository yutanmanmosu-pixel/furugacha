<section id="gacha" class="section" aria-labelledby="gacha-title">
  <div class="container">
    <div class="center">
      <h2 id="gacha-title" class="section-title">地域を選んで、<span class="deco nobr">ガチャをまわそう!</span></h2>
      <p class="section-lead">選ぶのは「範囲」だけ。どの自治体に決まるかは、ガチャのお楽しみ。</p>
    </div>

    <form id="scope-form" class="scope-card card" aria-label="ガチャ範囲の設定">
      <p class="scope-card__lead"><span class="pin" aria-hidden="true">📍</span>ガチャの範囲を決める</p>
      <div class="scope-tabs" role="radiogroup" aria-label="範囲の種類">
        <label><input type="radio" name="scope-type" value="all" checked>全国から</label>
        <label><input type="radio" name="scope-type" value="region">地方から</label>
        <label><input type="radio" name="scope-type" value="prefecture">都道府県から</label>
      </div>
      <div class="scope-selects">
        <span id="scope-region-wrap" hidden>
          <label class="visually-hidden" for="scope-region">地方を選択</label>
          <select id="scope-region"></select>
        </span>
        <span id="scope-pref-wrap" hidden>
          <label class="visually-hidden" for="scope-pref">都道府県を選択</label>
          <select id="scope-pref"></select>
        </span>
      </div>
      <div id="scope-chips" class="scope-chips" aria-label="地方のクイック選択">
        <button type="button" data-region="all" class="is-active" aria-pressed="true">全国</button>
        <button type="button" data-region="hokkaido" aria-pressed="false">北海道</button>
        <button type="button" data-region="tohoku" aria-pressed="false">東北</button>
        <button type="button" data-region="kanto" aria-pressed="false">関東</button>
        <button type="button" data-region="chubu" aria-pressed="false">中部</button>
        <button type="button" data-region="kinki" aria-pressed="false">近畿</button>
        <button type="button" data-region="chugoku" aria-pressed="false">中国</button>
        <button type="button" data-region="shikoku" aria-pressed="false">四国</button>
        <button type="button" data-region="kyushu" aria-pressed="false">九州</button>
        <button type="button" data-region="okinawa" aria-pressed="false">沖縄</button>
      </div>
      <div class="scope-bottom">
        <div>
          <p id="scope-count" aria-live="polite">対象範囲: 全国</p>
          <p class="scope-note">※ 自治体そのものは選べません。「どこに決まるか」までがガチャです。気に入らなければ何度でも回せます。</p>
        </div>
        <div id="scope-map" class="scope-map-mini" aria-hidden="true"></div>
      </div>
      <div class="scope-run">
        <button id="gacha-run" type="submit" class="btn btn--primary btn--xl">🎰 <span class="nobr">この範囲で</span><span class="nobr">ガチャをまわす</span></button>
      </div>
    </form>

    <div id="gacha-stage" class="gacha-stage" hidden>
      <svg class="gacha-stage__machine" viewBox="0 0 160 190" aria-hidden="true" focusable="false">
        <g class="gm">
          <circle cx="80" cy="62" r="52" fill="#EAF6FF" stroke="#C7DEEA" stroke-width="3"/>
          <circle class="gm-cap gm-cap--1" cx="62" cy="52" r="13" fill="#EF6351"/>
          <circle class="gm-cap gm-cap--2" cx="94" cy="42" r="12" fill="#FFC93C"/>
          <circle class="gm-cap gm-cap--3" cx="101" cy="70" r="13" fill="#7EC8E3"/>
          <circle class="gm-cap gm-cap--4" cx="72" cy="79" r="12" fill="#fff" stroke="#E3D9C2"/>
          <rect x="26" y="106" width="108" height="64" rx="18" fill="#2E7D46"/>
          <g class="gm-lamps">
            <circle class="gm-lamp" cx="38" cy="112" r="3.6"/>
            <circle class="gm-lamp" cx="80" cy="110" r="3.6"/>
            <circle class="gm-lamp" cx="122" cy="112" r="3.6"/>
          </g>
          <rect x="46" y="118" width="68" height="26" rx="10" fill="#FBF4E4"/>
          <g class="gm-knob">
            <circle cx="80" cy="131" r="8" fill="#DDE4EA" stroke="#AEB9C4" stroke-width="2"/>
            <rect x="76" y="124" width="8" height="14" rx="3" fill="#8C99A6" transform="rotate(35 80 131)"/>
          </g>
          <rect x="58" y="152" width="44" height="11" rx="5" fill="#1E4027"/>
          <circle class="gm-drop" cx="80" cy="150" r="9" fill="#EF6351" stroke="#C94B3B" stroke-width="2"/>
          <rect x="34" y="170" width="20" height="8" rx="4" fill="#1E4027"/>
          <rect x="106" y="170" width="20" height="8" rx="4" fill="#1E4027"/>
        </g>
      </svg>
      <div><span id="gacha-slot" class="gacha-slot">???</span></div>
      <p id="gacha-status" class="visually-hidden" role="status"></p>
    </div>
    <div id="gacha-confetti" aria-hidden="true"></div>

    <section id="gacha-result" class="result-card card" hidden aria-label="ガチャ結果">
      <p><span class="result-card__kicker">🎉 今回の運命の自治体は…</span><span id="result-scope" class="result-card__scope"></span></p>
      <div class="result-grid">
        <div>
          <h3 class="result-name"><span id="result-pref" class="pref"></span><span id="result-muni"></span></h3>
          <p id="result-note"></p>
          <div class="result-genres-wrap" hidden>
            <span class="label">返礼品の傾向(ピックアップより)</span>
            <ul id="result-genres" class="result-genres"></ul>
          </div>
          <div class="result-actions">
            <button id="btn-again" type="button" class="btn btn--primary">🎰 同じ範囲でもう一回</button>
            <button id="btn-change" type="button" class="btn btn--ghost">ガチャ範囲を変更</button>
          </div>
          <div class="result-actions">
            <button id="btn-fav-muni" type="button" class="btn btn--ghost btn--sm" aria-pressed="false">♡ 自治体をお気に入り</button>
            <button id="btn-share" type="button" class="btn btn--ghost btn--sm">結果を共有</button>
            <span id="share-done" class="note" aria-live="polite"></span>
          </div>
          <p><a id="result-rakuten-link" class="btn btn--green" href="https://event.rakuten.co.jp/furusato/" target="_blank" rel="noopener noreferrer"><span class="nobr">楽天ふるさと納税で</span><span class="nobr">この自治体を見る ›</span></a></p>
          <p class="result-positive">運命の出会い、いかがでしたか?気に入らなければ何度でも回してOK。寄附の前に、返礼品と自治体の情報をゆっくり確かめてくださいね。</p>
        </div>
        <div id="result-map" class="result-map" aria-hidden="true"></div>
      </div>
    </section>

    <section id="products" class="section" hidden aria-labelledby="products-title" style="padding-bottom:0">
      <div class="products-head">
        <h3 id="products-title"><span id="products-title-name"></span>の返礼品ピックアップ</h3>
        <span id="pr-badge" class="pr-badge" hidden>PR</span>
      </div>
      <p id="products-note" class="note"></p>
      <div id="products-grid" class="products-grid" aria-live="polite"></div>
      <p class="products-more"><button id="products-more-btn" class="btn btn--ghost" type="button" hidden></button></p>
    </section>
  </div>
</section>
