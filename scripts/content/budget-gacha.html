<section class="section">
  <div class="container">
    <div class="center">
      <h1 class="section-title">予算おまかせ<span class="deco">ガチャ</span></h1>
      <p class="section-lead">予算とカテゴリを決めるだけ。予算を<strong>絶対に超えない</strong>返礼品の組み合わせを、ガチャが提案します。</p>
    </div>

    <!-- method="dialog": 送信先の無いJS専用フォーム。JS到着前の誤送信で
         ?budget=&budget-count=auto へリロードされないようにする。 -->
    <form id="budget-form" method="dialog" class="card form-card" aria-label="予算おまかせガチャの設定">
      <div class="field">
        <label for="budget-input">予算(円)<span class="hint">2,000円〜2,000,000円</span></label>
        <input id="budget-input" name="budget" type="text" inputmode="numeric" autocomplete="off" placeholder="例: 50000">
        <p id="budget-handoff-note" class="note" hidden></p>
      </div>
      <div id="budget-count-field" class="field" hidden>
        <label for="budget-count">返礼品の点数<span class="hint">予算10,000円以上で選べます(最大5点)</span></label>
        <select id="budget-count" name="budget-count">
          <option value="auto" selected>おまかせ(最大5点)</option>
          <option value="1">1点</option>
          <option value="2">2点</option>
          <option value="3">3点</option>
          <option value="4">4点</option>
          <option value="5">5点</option>
        </select>
      </div>
      <fieldset style="border:none;padding:0;margin:0">
        <legend class="field" style="font-weight:800;margin-bottom:0">カテゴリを選ぶ</legend>
        <div id="budget-categories"></div>
      </fieldset>
      <p id="budget-error" class="error" hidden role="alert"></p>
      <div class="scope-run">
        <button id="budget-run" type="submit" class="btn btn--primary btn--xl">🎰 <span class="nobr">おまかせ</span><span class="nobr">ガチャをまわす</span></button>
      </div>
      <p class="note center">まだ予算が決まっていない方は、<a href="/calculator/">控除上限シミュレーター</a>で目安をチェックできます。</p>
    </form>

    <section id="budget-result" class="section" hidden aria-label="ガチャ結果" style="padding-bottom:0">
      <div class="products-head">
        <h2 class="section-title" style="margin:0">今回の組み合わせ</h2>
        <span id="budget-pr-badge" class="pr-badge" hidden>PR</span>
      </div>
      <p id="budget-summary" class="budget-summary" aria-live="polite"></p>
      <p id="budget-count-note" class="note" hidden></p>
      <p id="budget-note" class="note"></p>
      <div id="budget-grid" class="products-grid" aria-live="polite"></div>
      <p class="center" style="margin-top:22px"><button id="budget-again" type="button" class="btn btn--primary">🎰 同じ条件でもう一回</button></p>
      <div id="budget-share" class="xshare" hidden>
        <p class="xshare__row">
          <a id="budget-share-x" class="btn btn--x btn--sm" href="https://x.com/intent/tweet" target="_blank" rel="noopener noreferrer" aria-disabled="false"><span class="xshare__logo" aria-hidden="true">𝕏</span>Xで共有</a>
          <span id="budget-share-note" class="note xshare__note" role="status"></span>
        </p>
        <details id="budget-share-details" class="xshare__preview">
          <summary>投稿文を確認・コピー</summary>
          <label class="visually-hidden" for="budget-share-text">Xへの投稿文</label>
          <textarea id="budget-share-text" class="xshare__text" rows="9" readonly></textarea>
          <p class="xshare__actions">
            <button id="budget-share-copy" type="button" class="btn btn--ghost btn--sm">投稿文をコピー</button>
            <span id="budget-share-copied" class="note" role="status"></span>
          </p>
          <p class="note xshare__hint">Xの投稿画面が開くだけです。投稿するかどうかはご自身で確認してから決めてください(ふるガチャが自動で投稿することはありません)。</p>
        </details>
      </div>
      <p class="search-fallback-cta"><span class="search-fallback-cta__lead">やっぱり普通に探したい方は</span><a class="search-fallback-cta__link" href="/search/">返礼品をキーワードから探す ›</a></p>
    </section>
  </div>
</section>
